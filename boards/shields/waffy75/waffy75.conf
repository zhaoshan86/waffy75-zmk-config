CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

# Uncomment to enable the display
# CONFIG_ZMK_DISPLAY=y

# Enable deep sleep support timeout 900 seconds (15 minutes)
CONFIG_ZMK_SLEEP=y
# Enables all battery level detection/reporting
CONFIG_ZMK_BATTERY_REPORTING=y
CONFIG_BT_BAS=n
